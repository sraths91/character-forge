name: CI

on:
  push:
    branches: [main, 'p1/**']
  pull_request:
    branches: [main]

# GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`,
# so a failing command inside a pipe fails the step (the default shell has
# no pipefail).
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (warning ratchet — current count is 4, do not add any)
        run: npx eslint . --max-warnings 4

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      # docs/M45-CALIBRATOR-RESULTS.md is generated by
      # scripts/calibrator-baseline.mjs; fail when the two drift. One Node
      # version is enough (the script is deterministic); ~1 s.
      - name: Calibrator doc matches its generator
        if: matrix.node-version == 22
        env:
          CF_CALIBRATOR_DOC: '1'
        run: node --test src/tests/calibrator-doc.test.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify dist exists
        run: test -f dist/index.html

  # M64 decision 10: the Three.js track is frozen — review only, no edits.
  frozen-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on any change under the frozen 3D paths
        run: |
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          changed="$(git diff --name-only "${base}...HEAD" -- \
            src/js/anim/three-viewer.js \
            src/js/anim/three-scene.js \
            src/js/anim/modular-viewer.js \
            src/js/anim/modular-loadout.js \
            public/assets/3d)"
          if [ -n "${changed}" ]; then
            echo "::error::The 3D track is frozen (M64 decision 10). These files changed against ${base}:"
            echo "${changed}"
            exit 1
          fi
          echo "No changes under the frozen 3D paths against ${base}."
